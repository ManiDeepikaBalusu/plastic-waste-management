server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: plastic-waste-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plastic_waste_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:1234567890}
  api-secret: ${CLOUDINARY_API_SECRET:abcdefghijklmnopqrstuvwxyz}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    cookie-name: jwt_token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    initial-name: ${ADMIN_INITIAL_NAME:System Administrator}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
