server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: plastic-waste-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plastic_waste_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:kozxwvl6}
  api-key: ${CLOUDINARY_API_KEY:931751964176326}
  api-secret: ${CLOUDINARY_API_SECRET:y6RwVWLEYCHQ4lrbyu6U2tYTwbw}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    cookie-name: jwt_token
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    initial-name: ${ADMIN_INITIAL_NAME:System Administrator}
  verification:
    location-tolerance-meters: ${LOCATION_TOLERANCE_METERS:200.0}
    cleanup-tolerance-meters: ${CLEANUP_TOLERANCE_METERS:200.0}
    time-tolerance-hours: ${TIME_TOLERANCE_HOURS:24}
    ocr-service-url: ${OCR_SERVICE_URL:http://localhost:8001}
    ocr-enabled: ${OCR_ENABLED:true}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
    frontend-reset-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset-password}
    from-email: ${MAIL_FROM:no-reply@plasticwaste.org}
    dev-mode: ${DEV_MODE:false}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: never
